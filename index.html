<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>مركز إدارة الأساس | AL ASAS</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#f4f1ea;color:#273038}
    #boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    #boot-card{max-width:460px;background:#fffdf8;border:1px solid #ded7cc;border-radius:16px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(50,45,38,.08)}
    #boot-card h1{margin:0 0 10px;font-size:22px}
    #boot-card p{margin:0;color:#777;line-height:1.7;font-size:14px}
  </style>
  <script>
    if(location.pathname === '/alasas0') location.replace('/alasas0/'+location.search+location.hash);
    window.addEventListener('error',function(e){
      var c=document.getElementById('boot-card');
      if(c) c.innerHTML='<h1>تعذر تشغيل الواجهة</h1><p>حدث خطأ في تشغيل التطبيق. افتح أدوات المطور Console لمعرفة التفاصيل.</p>';
    });
    window.addEventListener('unhandledrejection',function(e){
      var c=document.getElementById('boot-card');
      if(c) c.innerHTML='<h1>تعذر تشغيل الواجهة</h1><p>حدث خطأ أثناء بدء التطبيق. راجع Console.</p>';
    });
  </script>
</head>
<body>
  <div id="root">
    <div id="boot-fallback"><div id="boot-card"><h1>جاري فتح نظام الأساس...</h1><p>إذا بقيت هذه الرسالة، تأكد أن GitHub Pages ينشر ملفات dist الناتجة عن Vite، وليس سورس المشروع.</p></div></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
